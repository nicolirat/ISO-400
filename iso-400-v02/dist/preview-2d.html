function mountProjectDialog(root, projects) {
const PROJECTS=projects, dialog=root.querySelector('dialog');
let lang='es',soundEnabled=false,activeProject=null,lastTrigger=null;
const capture=false,idx=()=>lang==='es'?0:1;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const abort=new AbortController(), options={signal:abort.signal};
const videoObserver=new IntersectionObserver(entries=>entries.forEach(({target:v,isIntersecting})=>{
v.muted=!(soundEnabled&&v.id==='project-video');
if(isIntersecting&&dialog.open&&!document.hidden&&!reduced.matches)v.play().catch(()=>{});
else v.pause();
}),{root:dialog,threshold:.05});
function observe(){videoObserver.disconnect();dialog.querySelectorAll('video').forEach(v=>videoObserver.observe(v));}
function media(m,name,cls=''){return m.type==='video'?`<video class="${cls}" muted loop playsinline controls preload="metadata" poster="${m.poster}" aria-label="${name}"><source src="${m.src}" type="video/mp4"><\/video>`:`<img class="${cls}" src="${m.src}" alt="${name}" loading="lazy">`;}
const emphasis={"brain":["cerebro digital","digital brain"],"arrivu":["claro, cercano y flexible","clear, approachable and flexible"],"cauye":["reflejo, naturaleza y un espíritu indómito","reflection, nature and an untamed spirit"],"ainwater":["inteligencia del agua","intelligence of water"],"macaix":["color, la textura y el detalle","colour, texture and detail"],"gota":["Tipografía, materia y agua","Typography, material and water"],"drysafe":["aventura","adventure"],"lt":["recorrer arquitectura","exploring architecture"],"udd":["pieza audiovisual","audiovisual piece"],"il-fuogo":["fuego a la mesa","fire to the table"],"liquid":["ritmo y dinamismo","rhythm and movement"]};
function intro(p){const text=p.intro[idx()],phrase=emphasis[p.key]?.[idx()];return phrase?text.replace(phrase,'<strong>'+phrase+'<\/strong>'):text;}
function renderProject(key){dialog.querySelectorAll("video").forEach(v=>v.pause());soundEnabled=false;activeProject=key;const p=PROJECTS.find(p=>p.key===key),next=PROJECTS[(PROJECTS.indexOf(p)+1)%PROJECTS.length];root.querySelector('#project-content').innerHTML=`<span class="eyebrow">ISO 400 / ${p.category[idx()]}<\/span><h2 class="detail-title" data-project-key="${p.key}" id="detail-heading">${p.name}<\/h2><div class="detail-lede"><span>${p.category[idx()]}<br>${lang==='es'?'Proyecto seleccionado':'Selected project'}<\/span><p>${intro(p)}<\/p><\/div><div class="detail-hero-media">${media(p.cover,p.name)}<\/div>${p.sections.map(sec=>`<section class="project-section"><h3>${sec.title[idx()]}<\/h3>${sec.text?`<p>${sec.text[idx()]}<\/p>`:''}${sec.colors?`<div class="swatches">${sec.colors.map(c=>`<span class="swatch" style="background:${c};color:${['#0D0D0D','#5F49F2'].includes(c)?'white':'#111'}">${c}<\/span>`).join('')}<\/div>`:''}<div class="detail-gallery">${sec.media.map(m=>`<figure class="${m.width/m.height>1.35?'landscape':''}">${media(m,m.caption||p.name)}${m.caption?`<figcaption>${m.caption}<\/figcaption>`:''}<\/figure>`).join('')}<\/div><\/section>`).join('')}<button class="detail-next">${lang==='es'?'Siguiente proyecto':'Next project'}: ${next.name} <svg class="project-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true" focusable="false" style="display:inline-block;vertical-align:-.12em;margin-left:.2em"><path d="M5 19 19 5M5 5h14v14"/><\/svg><\/button>`;root.querySelector('.detail-next').onclick=()=>{renderProject(next.key);dialog.scrollTop=0};setupProjectSound(p);observe()}

function setupProjectSound(project){
 root.querySelector('.project-sound')?.remove();
 const actions=root.querySelector('.project-actions')||(()=>{const a=document.createElement('div');a.className='project-actions';const close=root.querySelector('.close');close.before(a);a.append(close);return a})();
 if(!project.sound)return;
 const video=root.querySelector('.detail-hero-media video');video.id='project-video';
 const button=document.createElement('button');button.type='button';button.className='project-sound';button.setAttribute('aria-controls','project-video');
 const update=()=>{const label=lang==='es'?(soundEnabled?'Silenciar video':'Activar sonido del video'):(soundEnabled?'Mute video':'Enable video sound');button.setAttribute('aria-label',label);button.title=label;button.setAttribute('aria-pressed',String(soundEnabled));button.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true" focusable="false"><path d="M11 5 6 9H3v6h3l5 4V5Z"/>${soundEnabled?'<path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/>':'<path d="m16 9 6 6m0-6-6 6"/>'}<\/svg>`};

 button.onclick=()=>{soundEnabled=!soundEnabled;video.muted=!soundEnabled;update()};
 actions.append(button);update();
}

function openProject(key,trigger){lastTrigger=trigger;renderProject(key);dialog.showModal();dialog.scrollTop=0;root.dispatchEvent(new CustomEvent('iso400:dialog',{detail:{open:true}}));}
root.querySelector('.close').addEventListener('click',()=>dialog.close(),options);
dialog.addEventListener('close',()=>{videoObserver.disconnect();dialog.querySelectorAll('video').forEach(v=>v.pause());soundEnabled=false;activeProject=null;lastTrigger?.focus({preventScroll:true});root.dispatchEvent(new CustomEvent('iso400:dialog',{detail:{open:false}}));},options);
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}},options);
root.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;root.querySelectorAll('[data-lang]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));root.querySelector('.close').textContent=lang==='es'?'Cerrar ×':'Close ×';root.querySelector('.close').setAttribute('aria-label',lang==='es'?'Cerrar proyecto':'Close project');dialog.lang=lang;if(activeProject)renderProject(activeProject);},options));
document.addEventListener('visibilitychange',()=>{if(document.hidden)dialog.querySelectorAll('video').forEach(v=>v.pause());else if(dialog.open)observe();},options);
reduced.addEventListener('change',()=>{if(dialog.open)observe();},options);
return {open:openProject,destroy(){abort.abort();videoObserver.disconnect();dialog.querySelectorAll('video').forEach(v=>v.pause());dialog.close();root.querySelector('#project-content').replaceChildren();}};
}




const root=document.querySelector('#iso400-portfolio'),space=root.querySelector('.space'),cloud=root.querySelector('.project-cloud');
const motion=matchMedia('(prefers-reduced-motion: reduce)');
const controller=mountProjectDialog(root,PROJECTS),abort=new AbortController(),signal=abort.signal;
const caption=root.querySelector('.space-caption'),counter=root.querySelector('.space-index'),nameBand=root.querySelector('.opening-name');
let mode='cloud',target=0,phase=0,focus=0,opened=false,visible=true,raf=0,last=0,start=performance.now(),intro=motion.matches?1:0,orbit=0,drag=null,press=null,settle=0;
const covers=PROJECTS.map(p=>[p.cover,...p.sections.flatMap(s=>s.media)].find(m=>m.type==='video')||p.cover);
const cards=PROJECTS.map((p,i)=>{const m=covers[i],button=document.createElement('button');button.className='cloud-card';button.setAttribute('aria-label','Ver '+p.name);button.innerHTML=m.type==='video'?`<video src="${m.src}" poster="${m.poster||''}" muted loop playsinline preload="metadata" aria-label="${p.name}"><\/video>`:`<img src="${m.src}" alt="${p.name}" draggable="false">`;button.onclick=e=>{if(e.detail&&press?.moved)return;if(mode==='cloud'||Math.abs(phase-i)>.15){mode='focus';target=i;syncNav();wake();}else controller.open(p.key,button);};cloud.append(button);return button;});
function syncNav(){root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===mode)));}
function playback(){cards.forEach((c,i)=>{const v=c.querySelector('video');if(!v)return;v.muted=true;const allowed=!opened&&!document.hidden&&visible&&!motion.matches&&(mode==='cloud'||Math.abs(phase-i)<.65);if(allowed&&v.paused)v.play().catch(()=>{});else if(!allowed&&!v.paused)v.pause();});}
function wake(){if(!raf&&!document.hidden&&visible&&!opened){last=0;raf=requestAnimationFrame(frame);}playback();}
const ease=x=>x*x*(3-2*x),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function frame(now){raf=0;const dt=last?Math.min((now-last)/1000,.05):1/60;last=now;
intro=motion.matches?1:clamp((now-start)/2800,0,1);const desired=mode==='focus'?1:0;const k=motion.matches?1:1-Math.pow(.91,dt*60);focus+=(desired-focus)*k;phase+=(target-phase)*k;
if(!motion.matches&&focus<.99)orbit+=dt*.075;
const w=space.clientWidth,h=space.clientHeight,mobile=w<600,rx=Math.min(w*.16,210),ry=Math.min(h*.30,245);
const n=cards.length;cards.forEach((c,i)=>{const m=covers[i],aspect=m.width/m.height,a=i*2.399963+orbit,r=.07+.93*Math.sqrt((i+.6)/n);const delay=i*.021,arrival=ease(clamp((intro-delay)/(1-delay),0,1));
const cx=Math.cos(a)*rx*r*arrival,cy=Math.sin(a)*ry*r*arrival;
const smallH=(mobile?40:62)*(1+.14*Math.sin(a)),smallW=smallH*aspect;
const maxH=h*(mobile?.61:.69),maxW=w*(mobile?.82:.69),bigH=Math.min(maxH,maxW/aspect),bigW=bigH*aspect;
const rel=i-phase,fy=rel*h*.9,fx=Math.sin(rel)*w*.03;
const width=smallW+(bigW-smallW)*focus,height=smallH+(bigH-smallH)*focus;
c.style.width=width+'px';c.style.height=height+'px';c.style.transform=`translate(-50%,-50%) translate(${cx*(1-focus)+fx*focus}px,${cy*(1-focus)+fy*focus}px)`;
c.style.opacity=String(arrival*(1-focus+focus*clamp(1-Math.abs(rel)*1.3,0,1)));c.style.zIndex=String(Math.round(100-Math.abs(rel)*4));c.style.pointerEvents=focus>.5&&Math.abs(rel)>.55?'none':'auto';c.tabIndex=focus>.5&&Math.abs(rel)>.55?-1:0;
});
const i=clamp(Math.round(phase),0,n-1),p=PROJECTS[i];caption.innerHTML=p.name+'<span>'+p.category[0]+'<\/span>';caption.style.opacity=String(focus*clamp(1-Math.abs(phase-i)*2,0,1));counter.textContent=String(i+1).padStart(3,'0');
nameBand.style.opacity=String(intro<1?Math.sin(intro*Math.PI)*.9:0);playback();
if(!document.hidden&&visible&&!opened&&(!motion.matches&&mode==='cloud'||intro<1||Math.abs(focus-desired)>.001||Math.abs(phase-target)>.001))raf=requestAnimationFrame(frame);
}
function navigate(delta){if(mode==='cloud'){mode='focus';target=0;syncNav();}else target=clamp(target+delta,0,cards.length-1);clearTimeout(settle);settle=setTimeout(()=>{target=Math.round(target);wake();},170);wake();}
space.addEventListener('wheel',e=>{e.preventDefault();navigate(clamp(e.deltaY*(e.deltaMode===1?16:1),-90,90)/450);},{passive:false,signal});
space.addEventListener('pointerdown',e=>{if(e.target.closest('.space-header'))return;press={x:e.clientX,y:e.clientY,moved:false};drag={id:e.pointerId,y:e.clientY};},{signal});
space.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const d=drag.y-e.clientY;if(Math.abs(e.clientY-press.y)>6||Math.abs(e.clientX-press.x)>6)press.moved=true;if(press.moved){if(!space.hasPointerCapture(e.pointerId))space.setPointerCapture(e.pointerId);navigate(d/Math.max(250,space.clientHeight*.65));}drag.y=e.clientY;},{signal});
function release(e){if(drag?.id===e.pointerId){if(space.hasPointerCapture(e.pointerId))space.releasePointerCapture(e.pointerId);drag=null;}}
space.addEventListener('pointerup',release,{signal});space.addEventListener('pointercancel',release,{signal});
space.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight','PageDown','ArrowUp','ArrowLeft','PageUp','Home','Escape'].includes(e.key)){e.preventDefault();if(e.key==='Escape'){mode='cloud';syncNav();wake();}else if(e.key==='Home'){mode='focus';target=0;syncNav();wake();}else navigate(['ArrowDown','ArrowRight','PageDown'].includes(e.key)?1:-1);}},{signal});
root.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.view;target=Math.round(phase);syncNav();wake();},{signal}));
root.addEventListener('iso400:dialog',e=>{opened=e.detail.open;if(opened){cancelAnimationFrame(raf);raf=0;}else wake();playback();},{signal});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;}else wake();playback();},{signal});
const observer=new IntersectionObserver(([e])=>{visible=e.isIntersecting;if(visible)wake();else{cancelAnimationFrame(raf);raf=0;playback();}});observer.observe(space);
const resize=new ResizeObserver(wake);resize.observe(space);motion.addEventListener('change',wake,{signal});
addEventListener('pagehide',()=>{abort.abort();clearTimeout(settle);cancelAnimationFrame(raf);observer.disconnect();resize.disconnect();controller.destroy();cards.forEach(c=>c.querySelector('video')?.pause());},{once:true});wake();
