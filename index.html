function mountProjectDialog(root, projects) {
const PROJECTS=projects, dialog=root.querySelector('dialog');
let lang='es',soundEnabled=false,activeProject=null,lastTrigger=null;
const capture=false,idx=()=>lang==='es'?0:1;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const abort=new AbortController(), options={signal:abort.signal};
const videoObserver=new IntersectionObserver(entries=>entries.forEach(({target:v,isIntersecting})=>{
v.muted=!(soundEnabled&&v.id==='project-video');
if(isIntersecting&&dialog.open&&!document.hidden&&!reduced.matches)v.play().catch(()=>{});
else v.pause();
}),{root:dialog,threshold:.05});
function observe(){videoObserver.disconnect();dialog.querySelectorAll('video').forEach(v=>videoObserver.observe(v));}
function media(m,name,cls=''){return m.type==='video'?`<video class="${cls}" muted loop playsinline controls preload="metadata" poster="${m.poster}" aria-label="${name}"><source src="${m.src}" type="video/mp4"><\/video>`:`<img class="${cls}" src="${m.src}" alt="${name}" loading="lazy">`;}
const emphasis={"brain":["cerebro digital","digital brain"],"arrivu":["claro, cercano y flexible","clear, approachable and flexible"],"cauye":["reflejo, naturaleza y un espíritu indómito","reflection, nature and an untamed spirit"],"ainwater":["inteligencia del agua","intelligence of water"],"macaix":["color, la textura y el detalle","colour, texture and detail"],"gota":["Tipografía, materia y agua","Typography, material and water"],"drysafe":["aventura","adventure"],"lt":["recorrer arquitectura","exploring architecture"],"udd":["pieza audiovisual","audiovisual piece"],"il-fuogo":["fuego a la mesa","fire to the table"],"liquid":["ritmo y dinamismo","rhythm and movement"]};
function intro(p){const text=p.intro[idx()],phrase=emphasis[p.key]?.[idx()];return phrase?text.replace(phrase,'<strong>'+phrase+'<\/strong>'):text;}
function renderProject(key){dialog.querySelectorAll("video").forEach(v=>v.pause());soundEnabled=false;activeProject=key;const p=PROJECTS.find(p=>p.key===key),next=PROJECTS[(PROJECTS.indexOf(p)+1)%PROJECTS.length];root.querySelector('#project-content').innerHTML=`<span class="eyebrow">ISO 400 / ${p.category[idx()]}<\/span><h2 class="detail-title" data-project-key="${p.key}" id="detail-heading">${p.name}<\/h2><div class="detail-lede"><span>${p.category[idx()]}<br>${lang==='es'?'Proyecto seleccionado':'Selected project'}<\/span><p>${intro(p)}<\/p><\/div>${p.key==='caos'?`<div class="caos-video-grid" aria-label="${lang==='es'?'Cuatro videos de CAOS':'Four CAOS videos'}">${[p.cover,...p.sections.flatMap(sec=>sec.media)].filter(m=>m.type==='video').map((m,i)=>`<figure>${media(m,`${p.name} — ${i+1}`)}<\/figure>`).join('')}<\/div>`:`<div class="detail-hero-media">${media(p.cover,p.name)}<\/div>${p.sections.map(sec=>`<section class="project-section"><h3>${sec.title[idx()]}<\/h3>${sec.text?`<p>${sec.text[idx()]}<\/p>`:''}${sec.colors?`<div class="swatches">${sec.colors.map(c=>`<span class="swatch" style="background:${c};color:${['#0D0D0D','#5F49F2'].includes(c)?'white':'#111'}">${c}<\/span>`).join('')}<\/div>`:''}<div class="detail-gallery">${sec.media.map(m=>`<figure class="${m.width/m.height>1.35?'landscape':''}">${media(m,m.caption||p.name)}${m.caption?`<figcaption>${m.caption}<\/figcaption>`:''}<\/figure>`).join('')}<\/div><\/section>`).join('')}`}<button class="detail-next">${lang==='es'?'Siguiente proyecto':'Next project'}: ${next.name} <svg class="project-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true" focusable="false" style="display:inline-block;vertical-align:-.12em;margin-left:.2em"><path d="M5 19 19 5M5 5h14v14"/><\/svg><\/button>`;root.querySelector('.detail-next').onclick=()=>{renderProject(next.key);dialog.scrollTop=0};setupProjectSound(p);observe()}

function setupProjectSound(project){
 root.querySelector('.project-sound')?.remove();

const root=document.querySelector('#iso400-portfolio'),space=root.querySelector('.space'),cloud=root.querySelector('.project-cloud');
const motion=matchMedia('(prefers-reduced-motion: reduce)'),abort=new AbortController(),signal=abort.signal;
const controller=mountProjectDialog(root,PROJECTS),caption=root.querySelector('.space-caption'),counter=root.querySelector('.space-index');
let lang='es',rotation=0,rotationTarget=0,zoom=0,zoomTarget=0,opened=false,visible=true,raf=0,last=0,start=performance.now(),drag=null,press=null,front=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=x=>x*x*(3-2*x);
const covers=PROJECTS.map(p=>[p.cover,...p.sections.flatMap(s=>s.media)].find(m=>m.type==='video')||p.cover);
const cards=PROJECTS.map((p,i)=>{const m=covers[i],b=document.createElement('button');b.className='cloud-card';b.innerHTML=m.type==='video'?`<video src="${m.src}" poster="${m.poster||''}" muted loop playsinline preload="metadata" aria-label="${p.name}"><\/video>`:`<img src="${m.src}" alt="${p.name}" draggable="false">`;b.setAttribute('aria-label','Abrir '+p.name);b.onclick=e=>{if(e.detail&&press?.moved)return;controller.open(p.key,b);};cloud.append(b);return b;});
function playback(){cards.forEach(c=>{const v=c.querySelector('video');if(!v)return;const allowed=!opened&&!document.hidden&&visible&&!motion.matches;v.muted=true;if(allowed&&v.paused&&!v.dataset.starting){v.dataset.starting='1';v.play().catch(()=>{}).finally(()=>delete v.dataset.starting);}else if(!allowed&&!v.paused)v.pause();});}
function wake(){if(!raf&&!document.hidden&&visible&&!opened){last=0;raf=requestAnimationFrame(frame);}playback();}
function frame(now){raf=0;const dt=last?Math.min((now-last)/1000,.05):1/60;last=now;const k=motion.matches?1:1-Math.pow(.88,dt*60);rotation+=(rotationTarget-rotation)*k;zoom+=(zoomTarget-zoom)*k;
const intro=motion.matches?1:clamp((now-start)/2200,0,1),w=space.clientWidth,h=space.clientHeight,mobile=w<600;
const radius=Math.min(w*(mobile?.27:.16),h*.27),spread=1+zoom*.7;let nearest=Infinity;
cards.forEach((c,i)=>{const m=covers[i],aspect=m.width/m.height;const yUnit=1-2*(i+.5)/cards.length;const ring=Math.sqrt(1-yUnit*yUnit);const a=i*2.399963+rotation;
const rawX=Math.sin(a)*ring,rawZ=Math.cos(a)*ring;
// Tilt the orbital field: each cover comes forward along a circular path, never a vertical list.
const tilt=.48,yy=yUnit*Math.cos(tilt)-rawZ*Math.sin(tilt),zz=yUnit*Math.sin(tilt)+rawZ*Math.cos(tilt);
const depth=(zz+1)/2,arrival=ease(clamp((intro-i*.015)/.82,0,1));
const perspective=1/(1-zz*.25*zoom),x=rawX*radius*spread*perspective*arrival,y=yy*radius*1.25*spread*perspective*arrival;
const base=(mobile?35:48)+(mobile?26:35)*depth;const targetH=Math.min(h*.38,w*.38/aspect);const size=(base+(targetH-base)*zoom*Math.pow(depth,3))*arrival;
c.style.width=(size*aspect)+'px';c.style.height=size+'px';c.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px)`;c.style.opacity=String(arrival*(.38+.62*depth));c.style.zIndex=String(Math.round(depth*100));
const score=Math.hypot(x,y)/(radius||1)+(1-depth)*1.5;if(score<nearest){nearest=score;front=i;}
c.style.pointerEvents=depth>.38?'auto':'none';c.tabIndex=depth>.38?0:-1;
});
const selected=PROJECTS[front];caption.textContent=selected.name+' — '+selected.category[lang==='es'?0:1];caption.style.opacity=String(zoom*.85);counter.textContent=String(front+1).padStart(3,'0');
playback();if(!document.hidden&&visible&&!opened&&(intro<1||Math.abs(rotationTarget-rotation)>.0001||Math.abs(zoomTarget-zoom)>.0001))raf=requestAnimationFrame(frame);
}
function navigate(dx,dy){rotationTarget+=(dy+dx)*.0028;zoomTarget=clamp(zoomTarget+dy*.0016,0,1);wake();}
space.addEventListener('wheel',e=>{e.preventDefault();const unit=e.deltaMode===1?16:e.deltaMode===2?space.clientHeight:1;navigate(clamp(e.deltaX*unit,-100,100),clamp(e.deltaY*unit,-100,100));},{passive:false,signal});
space.addEventListener('pointerdown',e=>{if(e.target.closest('.space-header'))return;press={x:e.clientX,y:e.clientY,moved:false};drag={id:e.pointerId,x:e.clientX,y:e.clientY};},{signal});
space.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;if(Math.hypot(e.clientX-press.x,e.clientY-press.y)>6)press.moved=true;if(press.moved){if(!space.hasPointerCapture(e.pointerId))space.setPointerCapture(e.pointerId);navigate((drag.x-e.clientX)*2,(drag.y-e.clientY)*2);}drag.x=e.clientX;drag.y=e.clientY;},{signal});
function release(e){if(drag?.id===e.pointerId){if(space.hasPointerCapture(e.pointerId))space.releasePointerCapture(e.pointerId);drag=null;}}
space.addEventListener('pointerup',release,{signal});space.addEventListener('pointercancel',release,{signal});
space.addEventListener('keydown',e=>{if(e.target.closest('.space-header'))return;const keys=['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Home','Escape'];if(!keys.includes(e.key))return;e.preventDefault();if(e.key==='Home'||e.key==='Escape'){rotationTarget=0;zoomTarget=0;wake();}else navigate(e.key==='ArrowRight'?150:e.key==='ArrowLeft'?-150:0,e.key==='ArrowDown'?150:e.key==='ArrowUp'?-150:0);},{signal});
root.addEventListener('iso400:dialog',e=>{opened=e.detail.open;if(opened){cancelAnimationFrame(raf);raf=0;}else wake();playback();},{signal});

addEventListener('pagehide',()=>{abort.abort();cancelAnimationFrame(raf);observer.disconnect();resize.disconnect();controller.destroy();cards.forEach(c=>c.querySelector('video')?.pause());},{once:true});translate();
